<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1769e0">
  <title>Camera room</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #203040;
      background-image: url("LTasset.jpg");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      padding: clamp(18px, 4vw, 32px);
    }

    main {
      width: min(100%, 1000px);
      background-color: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
      padding: clamp(24px, 5vw, 40px);
      text-align: center;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.9rem, 4vw, 2.7rem);
    }

    p {
      line-height: 1.5;
      margin: 0 0 18px;
      font-size: clamp(1rem, 2vw, 1.1rem);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      margin: 16px 0;
    }

    input,
    button {
      min-height: 52px;
      border: 0;
      border-radius: 8px;
      font: inherit;
    }

    input {
      width: min(100%, 280px);
      border: 1px solid #c7d5ee;
      background: #fff;
      color: #1c2736;
      padding: 12px 14px;
    }

    button {
      background: #1769e0;
      color: #fff;
      cursor: pointer;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 12px 20px;
    }

    button:hover:not(:disabled) {
      background: #0f4fae;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #status {
      min-height: 1.5em;
      color: #1c2736;
    }

    #count {
      font-size: 0.95rem;
    }

    #invite {
      display: none;
      width: min(100%, 620px);
      margin: 0 auto 16px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid #c7d5ee;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    #inviteLink {
      display: block;
      color: #1769e0;
      margin: 6px 0 10px;
    }

    #copyInvite {
      min-height: 44px;
    }

    #videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .tile {
      min-width: 0;
      background: #fff;
      border: 1px solid #c7d5ee;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(23, 105, 224, 0.08);
    }

    .tile video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #203040;
    }

    .tile .name {
      padding: 8px 12px;
      color: #1c2736;
      font-weight: 700;
    }

    .hint {
      font-size: 0.95rem;
    }

    @media (max-width: 560px) {
      body {
        align-items: flex-start;
      }

      main {
        padding: 22px 16px;
      }

      .controls {
        flex-direction: column;
      }

      input,
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Camera Room</h1>
    <p>Join the room to share your camera and microphone and see and hear everyone.</p>
    <div id="invite">
      <strong>Invite people with this link</strong>
      <a id="inviteLink"></a>
      <button id="copyInvite" type="button">Copy link</button>
    </div>
    <div class="controls">
      <input id="displayName" maxlength="32" placeholder="Your name (optional)" aria-label="Your name">
      <button id="join" type="button">Join with camera</button>
      <button id="leave" type="button" disabled>Leave room</button>
    </div>
    <p id="status" role="status" aria-live="polite">Ready. Share the invite link with your group.</p>
    <p id="count" class="hint">0 people in the room</p>
    <section id="videos" aria-label="People in the room"></section>
  </main>

  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';
    import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js';
    import {
      getDatabase, ref, set, onChildAdded, onChildRemoved, onDisconnect, remove
    } from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBNup39BPaDHu3tsr6sTwfG5g7kCyjMK-g",
      authDomain: "ls-awesome.firebaseapp.com",
      databaseURL: 'https://ls-awesome-default-rtdb.firebaseio.com/',
      projectId: "ls-awesome",
      appId: "1:380228921144:web:32dc838988689f45a943cd",
    };

    const statusEl = document.querySelector('#status');
    const joinButton = document.querySelector('#join');
    const leaveButton = document.querySelector('#leave');
    const videosEl = document.querySelector('#videos');
    const countEl = document.querySelector('#count');
    const members = new Map();
    const calls = new Map();
    let app, auth, db, localStream, peer, user, memberRef, stopAdded, stopRemoved;

    function status(message) { statusEl.textContent = message; }
    function roomToken() {
      const params = new URLSearchParams(location.search);
      let token = params.get('room');
      if (!token) {
        const bytes = crypto.getRandomValues(new Uint8Array(32));
        token = Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
        params.set('room', token);
        history.replaceState(null, '', `${location.pathname}?${params.toString()}${location.hash}`);
      }
      if (!/^[a-f0-9]{64}$/i.test(token)) throw new Error('This invite link is not valid. Ask the host for a fresh link.');
      return token;
    }

    const token = roomToken();
    const inviteUrl = location.href;
    document.querySelector('#inviteLink').href = inviteUrl;
    document.querySelector('#inviteLink').textContent = inviteUrl;
    document.querySelector('#invite').style.display = 'block';

    function updateCount() {
      const n = (localStream ? 1 : 0) + members.size;
      countEl.textContent = `${n} ${n === 1 ? 'person' : 'people'} in the room`;
    }

    function addVideoTile(key, label, stream, local = false) {
      let tile = document.querySelector(`[data-peer="${CSS.escape(key)}"]`);
      if (!tile) {
        tile = document.createElement('article');
        tile.className = 'tile';
        tile.dataset.peer = key;
        const video = document.createElement('video');
        video.autoplay = true;
        video.playsInline = true;
        video.muted = local;
        video.controls = !local;
        const name = document.createElement('div');
        name.className = 'name';
        tile.append(video, name);
        videosEl.append(tile);
      }
      tile.querySelector('.name').textContent = label;
      tile.querySelector('video').srcObject = stream;
    }

    function removeVideoTile(key) {
      document.querySelector(`[data-peer="${CSS.escape(key)}"]`)?.remove();
    }

    function attachCall(mediaCall, isOutgoing = false) {
      const otherId = mediaCall.peer;
      if (calls.has(otherId)) { mediaCall.close(); return; }
      calls.set(otherId, mediaCall);
      if (!isOutgoing) mediaCall.answer(localStream);
      mediaCall.on('stream', stream => {
        const member = [...members.values()].find(item => item.peerId === otherId);
        addVideoTile(otherId, member?.name || 'Guest', stream);
      });
      const clean = () => {
        if (calls.get(otherId) === mediaCall) calls.delete(otherId);
        removeVideoTile(otherId);
      };
      mediaCall.on('close', clean);
      mediaCall.on('error', error => {
        clean();
        status('Video connection error: ' + error.message);
      });
    }

    async function leaveRoom(message = 'You left the room.') {
      joinButton.disabled = false;
      leaveButton.disabled = true;
      if (stopAdded) { stopAdded(); stopAdded = null; }
      if (stopRemoved) { stopRemoved(); stopRemoved = null; }
      for (const call of calls.values()) call.close();
      calls.clear();
      if (peer) { peer.destroy(); peer = null; }
      if (memberRef) {
        try { await remove(memberRef); } catch { /* onDisconnect also removes stale presence. */ }
        memberRef = null;
      }
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      members.clear();
      videosEl.replaceChildren();
      updateCount();
      status(message);
    }

    async function waitForOpen(peerObject) {
      return new Promise((resolve, reject) => {
        peerObject.once('open', resolve);
        peerObject.once('error', reject);
      });
    }

    joinButton.addEventListener('click', async () => {
      joinButton.disabled = true;
      status('Asking for camera permission…');
      try {
        if (firebaseConfig.apiKey.startsWith('PASTE_')) {
          throw new Error('First add your Firebase web app settings to this file. Follow the setup steps.');
        }
        if (!navigator.mediaDevices?.getUserMedia) throw new Error('Camera and microphone access requires opening this page over HTTPS.');
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        user = await signInAnonymously(auth);
        addVideoTile('self', (document.querySelector('#displayName').value.trim() || 'You') + ' (you)', localStream, true);
        updateCount();
        status('Connecting to the room…');

        peer = new Peer();
        const peerId = await waitForOpen(peer);
        const membersRef = ref(db, `rooms/${token}/members`);
        memberRef = ref(db, `rooms/${token}/members/${user.user.uid}`);
        await onDisconnect(memberRef).remove();
        await set(memberRef, {
          peerId,
          name: document.querySelector('#displayName').value.trim().slice(0, 32) || 'Guest',
          joinedAt: Date.now()
        });

        peer.on('call', mediaCall => attachCall(mediaCall));
        stopAdded = onChildAdded(membersRef, snapshot => {
          if (snapshot.key === user.user.uid) return;
          const member = snapshot.val();
          if (!member?.peerId || member.peerId === peerId) return;
          members.set(snapshot.key, member);
          updateCount();
          if (peerId.localeCompare(member.peerId) < 0 && !calls.has(member.peerId)) {
            const outgoing = peer.call(member.peerId, localStream);
            if (outgoing) attachCall(outgoing, true);
          }
          const existingTile = document.querySelector(`[data-peer="${CSS.escape(member.peerId)}"] .name`);
          if (existingTile) existingTile.textContent = member.name || 'Guest';
        });
        stopRemoved = onChildRemoved(membersRef, snapshot => {
          const member = members.get(snapshot.key);
          if (member?.peerId) {
            calls.get(member.peerId)?.close();
            removeVideoTile(member.peerId);
          }
          members.delete(snapshot.key);
          updateCount();
        });
        leaveButton.disabled = false;
        status('You’re in the room. Share the invite link so others can join.');
      } catch (error) {
        await leaveRoom('Could not join: ' + (error.message || 'Please check the setup and try again.'));
      }
    });

    leaveButton.addEventListener('click', () => leaveRoom());
    document.querySelector('#copyInvite').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(inviteUrl);
        status('Invite link copied. Send it to the people you want in the room.');
      } catch {
        status('Copy the invite link shown above and send it to your group.');
      }
    });

    try {
      if (!firebaseConfig.apiKey.startsWith('PASTE_')) {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getDatabase(app);
      }
    } catch (error) {
      status('Firebase setup needs attention: ' + error.message);
    }
  </script>
</body>
</html>
