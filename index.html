<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firewall</title>
  <!-- Load html5-qrcode library from CDN (no backend required) -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f4f6f8;
      color: #1f2937;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .container {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    h1 {
      font-size: 1.4rem;
      margin-top: 0;
      margin-bottom: 8px;
    }
    p {
      font-size: 0.95rem;
      color: #4b5563;
      margin-bottom: 20px;
    }
    #reader {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
    }
    #status {
      margin-top: 16px;
      font-size: 0.95rem;
      font-weight: 500;
      word-break: break-all;
    }
    .error {
      color: #dc2626;
    }
    .success {
      color: #16a34a;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Firewall</h1>
    <p>Point your camera at the authenticator device to continue.</p>
    
    <!-- Camera feed container -->
    <div id="reader"></div>
    
    <!-- Status messages -->
    <div id="status">Waiting for camera permission...</div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    let isRedirecting = false;

    // Validate that the scanned text is a safe http/https URL
    function isValidHttpUrl(text) {
      try {
        const url = new URL(text);
        return url.protocol === "http:" || url.protocol === "https:";
      } catch (_) {
        return false;
      }
    }

    // Runs when a QR code is successfully read
    function onScanSuccess(decodedText) {
      if (isRedirecting) return;

      if (isValidHttpUrl(decodedText)) {
        isRedirecting = true;
        statusEl.className = "success";
        statusEl.textContent = `Redirecting to: ${decodedText}`;

        // Stop the camera cleanly before redirecting
        html5QrcodeScanner.clear().then(() => {
          window.location.href = decodedText;
        }).catch(() => {
          window.location.href = decodedText;
        });
      } else {
        statusEl.className = "error";
        statusEl.textContent = `Scanned text is not a valid URL: "${decodedText}"`;
      }
    }

    // Initialize the scanner UI
    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: { width: 250, height: 250 },
        rememberLastUsedCamera: true
      },
      /* verbose= */ false
    );

    html5QrcodeScanner.render(onScanSuccess);
    statusEl.textContent = "Ready to scan.";
  </script>

</body>
</html>
