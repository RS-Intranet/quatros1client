<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback</title>
    <link rel="icon" href="tab.png" type="image/png" />
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: clamp(18px, 4vw, 32px);
        text-align: center;
        background: #f3f7ff;
        color: #1c2736;
      }

      header,
      main {
        width: min(100%, 720px);
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: min(100%, 420px);
        margin: 0 auto;
      }

      label {
        font-size: 1rem;
        font-weight: 700;
      }

      textarea {
        width: 100%;
        min-height: 180px;
        resize: vertical;
        padding: 12px;
        border: 1px solid #c7d5ee;
        border-radius: 8px;
        font: inherit;
      }

      button,
      form a {
        display: block;
        width: 100%;
        min-height: 52px;
        border: 0;
        border-radius: 8px;
        background: #1769e0;
        color: #fff;
        font-size: 1.05rem;
        font-weight: 700;
        text-decoration: none;
        padding: 12px 20px;
        cursor: pointer;
        line-height: 1.3;
      }

      button:hover,
      form a:hover {
        background: #0f4fae;
      }

      @media (max-width: 480px) {
        body {
          padding: 18px 14px;
        }

        h1 {
          font-size: 1.8rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Add text</h1>
    </header>

    <main>
      <p>Add text</p>

      <form action="mailto:davisdesue@gmail.com,slovak4096@gmail.com" method="post" enctype="text/plain">
        <label for="feedback">Feedback</label>
        <textarea id="feedback" name="feedback" rows="8" cols="50" required></textarea>
        <button type="submit">Submit</button>
        <a href="subnet.html">Back</a>
      </form>
    </main>
  </body>
</html>
