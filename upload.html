<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload your file</title>
    <link rel="icon" href="favicon.png" type="image/png" />
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: clamp(18px, 4vw, 32px);
        text-align: center;
        background: #f3f7ff;
        color: #1c2736;
      }

      main {
        width: min(100%, 720px);
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(1.9rem, 4vw, 2.8rem);
      }

      p {
        margin: 0 0 12px;
        line-height: 1.6;
        font-size: clamp(1rem, 2vw, 1.15rem);
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: min(100%, 420px);
        margin: 0 auto;
      }

      label {
        text-align: left;
        font-weight: 700;
      }

      input[type="file"] {
        width: 100%;
        margin-top: 6px;
      }

      button {
        width: 100%;
        min-height: 52px;
        border: 0;
        border-radius: 8px;
        background: #1769e0;
        color: #fff;
        font-size: 1.05rem;
        font-weight: 700;
        cursor: pointer;
        padding: 12px 20px;
      }

      button:hover {
        background: #0f4fae;
      }

      .back-button {
        display: block;
        width: min(100%, 420px);
        margin: 12px auto 0;
        min-height: 52px;
        border: 0;
        border-radius: 8px;
        background: #1769e0;
        color: #fff;
        text-decoration: none;
        font-size: 1.05rem;
        font-weight: 700;
        padding: 12px 20px;
        line-height: 1.4;
      }

      @media (max-width: 480px) {
        body {
          padding: 18px 14px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>File Upload Portal</h1>
      <p>Upload your file here!</p>
      <p>You can choose to contribute to the Intranet's subnet by uploading a file that you want included in the page.</p>
      <p>Find the hotspot and connect to it. Switch networks while staying on this page.</p>

      <form action="https://formspree.io" method="POST" enctype="multipart/form-data">
        <label>
          Upload your file:
          <input type="file" name="upload" />
        </label>
        <button type="submit">Submit</button>
      </form>

      <a class="back-button" href="subnet.html">Back</a>
    </main>
  </body>
</html>
