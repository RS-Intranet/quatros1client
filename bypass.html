<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Firewall Whitelist</title>
		<style>
			body {
				align-items: center;
				display: flex;
				flex-direction: column;
				justify-content: center;
				margin: 0;
				min-height: 100vh;
				padding: 24px;
				text-align: center;
			}

			form {
				align-items: center;
				display: flex;
				flex-direction: column;
				gap: 12px;
				max-width: 420px;
				width: 100%;
			}

			input {
				box-sizing: border-box;
				font-size: 1.1rem;
				padding: 12px;
				width: 100%;
			}

			button {
				background-color: #1769e0;
				border: 0;
				border-radius: 6px;
				color: #ffffff;
				cursor: pointer;
				font-size: 1.1rem;
				font-weight: 700;
				min-height: 52px;
				padding: 12px 32px;
				width: 100%;
			}

			button:hover {
				background-color: #0f4fae;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Firewall Whitelist</h1>
			<form id="whitelist-form">
				<label for="email">Enter your email address:</label>
				<input id="email" name="email" type="email" required>
				<button type="submit">Continue</button>
				<p id="error-message" role="alert" hidden>You are not whitelisted. To apply for firewall whitelisting, contact the admin.</p>
			</form>
		</main>

		<script>
			const whitelistedEmails = [
				'jessiedesue@gmail.com',
				'rob.desue@gmail.com',
				'davisdesue@gmail.com',
				'augiedesue@gmail.com'
			];

			document.getElementById('whitelist-form').addEventListener('submit', function (event) {
				event.preventDefault();

				const email = document.getElementById('email').value.trim();
				const errorMessage = document.getElementById('error-message');

				if (whitelistedEmails.includes(email)) {
					window.location.href = 'subnet.html';
					return;
				}

				errorMessage.hidden = false;
			});
		</script>
	</body>
</html>
