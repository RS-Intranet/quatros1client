<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="tab.png" type="image/png" />
    <title>Firewall Whitelist</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(16px, 4vw, 32px);
        text-align: center;
        background: #f3f7ff;
        color: #1c2736;
      }

      main {
        width: min(100%, 460px);
      }

      form {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        width: 100%;
      }

      label {
        font-size: 1rem;
        line-height: 1.5;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        font-size: 1.05rem;
        border: 1px solid #c7d5ee;
        border-radius: 8px;
      }

      button {
        width: 100%;
        min-height: 52px;
        border: 0;
        border-radius: 8px;
        background: #1769e0;
        color: #fff;
        font-size: 1.05rem;
        font-weight: 700;
        cursor: pointer;
        padding: 12px 20px;
      }

      button:hover {
        background: #0f4fae;
      }

      #error-message {
        margin: 0;
        color: #b42318;
        font-size: 0.95rem;
        line-height: 1.5;
      }

      @media (max-width: 480px) {
        body {
          padding: 18px 14px;
        }

        h1 {
          font-size: 1.7rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Firewall Whitelist</h1>
      <form id="whitelist-form">
        <label for="email">Enter your email address:</label>
        <input id="email" name="email" type="email" required />
        <button type="submit">Continue</button>
        <p id="error-message" role="alert" hidden>
          You are not whitelisted. To apply for firewall whitelisting, contact the admin.
        </p>
      </form>
    </main>

    <script>
      const whitelistedEmails = [
        'jessiedesue@gmail.com',
        'rob.desue@gmail.com',
        'davisdesue@gmail.com',
        'augiedesue@gmail.com'
      ];

      document.getElementById('whitelist-form').addEventListener('submit', function (event) {
        event.preventDefault();

        const email = document.getElementById('email').value.trim();
        const errorMessage = document.getElementById('error-message');

        if (whitelistedEmails.includes(email)) {
          window.location.href = 'subnet.html';
          return;
        }

        errorMessage.hidden = false;
      });
    </script>
  </body>
</html>
